spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cropflow
    username: cropflow_app
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

cropflow:
  security:
    jwt:
      issuer: cropflow-api
      secret: ${JWT_SECRET}
      access-token-ttl: 15m